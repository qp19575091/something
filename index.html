<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>something 目錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a2e;--sub:#4a4a6a;--mute:#8888a0;--border:#d4d4e0;
  --bg:#f7f6f3;--card:#fff;--accent:#2d5a7b;--accent-light:#e8f0f6;
  --font-serif:'Noto Serif TC',serif;--font-sans:'Noto Sans TC',sans-serif;
  --max-w:780px;
}
html{font-size:15px}
body{font-family:var(--font-sans);color:var(--ink);background:var(--bg);line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max-w);margin:0 auto;padding:48px 16px 64px}
h1{font-family:var(--font-serif);font-size:1.8rem;font-weight:700;margin-bottom:4px}
.lead{color:var(--sub);font-size:.9rem;margin-bottom:28px}
.cat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;color:inherit;text-decoration:none;transition:box-shadow .2s,border-color .2s}
.cat-card:hover,.cat-card:focus{box-shadow:0 4px 16px rgba(0,0,0,.06);border-color:var(--accent)}
.cat-card .icon{font-size:1.6rem;line-height:1}
.cat-card h2{font-family:var(--font-serif);font-size:1.2rem;font-weight:700;color:var(--accent);margin:8px 0 4px}
.cat-card .desc{font-size:.85rem;color:var(--sub)}
</style>
</head>
<body>
<main class="wrap">
  <h1>something</h1>
  <p class="lead">個人雜物收納庫，點選類別即可開啟。</p>

  <div class="cat-list">
    <a class="cat-card" href="trip/">
      <div class="icon">✈️</div>
      <h2>旅遊</h2>
      <div class="desc">行程規劃・1 趟（關西 2026/12）</div>
    </a>
  </div>
</main>
</body>
</html>
