<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雜物收納櫃</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a2e;--sub:#4a4a6a;--mute:#8888a0;--border:#d4d4e0;
  --bg:#f7f6f3;--bg-dot:#e6e3dc;--card:#fff;--accent:#2d5a7b;--accent-light:#e8f0f6;
  --warm:#c45d3e;--warm-light:#fdf0ec;
  --cat-trip:#2d5a7b;--cat-trip-light:#e8f0f6;
  --shadow:0 1px 2px rgba(26,26,46,.04),0 8px 24px rgba(26,26,46,.06);
  --shadow-hover:0 2px 4px rgba(26,26,46,.06),0 16px 40px rgba(26,26,46,.10);
  --font-serif:'Noto Serif TC',serif;--font-sans:'Noto Sans TC',sans-serif;
  --max-w:860px;
}
html{font-size:15px}
body{font-family:var(--font-sans);color:var(--ink);background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1px);background-size:22px 22px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:var(--max-w);margin:0 auto;padding:72px 16px 64px}

.hero{text-align:center;margin-bottom:48px}
.hero .eyebrow{display:inline-block;font-size:.72rem;letter-spacing:.3em;color:var(--warm);background:var(--warm-light);padding:4px 14px;border-radius:999px;margin-bottom:18px}
.hero h1{font-family:var(--font-serif);font-weight:900;font-size:clamp(2.2rem,8vw,3.2rem);letter-spacing:.12em;line-height:1.2}
.hero .sub{color:var(--sub);margin-top:12px;font-size:.95rem}
.hero .rule{width:48px;height:3px;border-radius:2px;background:var(--warm);margin:22px auto 0}

.section-title{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:1rem;font-weight:700;color:var(--sub);margin-bottom:16px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.drawers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.drawer{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 22px 18px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.drawer::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.drawer:hover,.drawer:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--c)}
.drawer .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--c-light)}
.drawer h2{font-family:var(--font-serif);font-size:1.35rem;font-weight:700;margin:14px 0 2px}
.drawer .desc{font-size:.85rem;color:var(--sub);flex:1}
.drawer .meta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);font-size:.78rem;color:var(--mute)}
.drawer .count{font-weight:600;color:var(--c)}
.drawer .arrow{font-size:1rem;color:var(--c);transition:transform .2s}
.drawer:hover .arrow{transform:translateX(4px)}
.drawer.trip{--c:var(--cat-trip);--c-light:var(--cat-trip-light)}

.drawer.empty{align-items:center;justify-content:center;text-align:center;background:transparent;border:1.5px dashed var(--border);box-shadow:none;color:var(--mute);min-height:200px;font-size:.85rem}
.drawer.empty::before{display:none}
.drawer.empty .plus{font-size:1.6rem;line-height:1;margin-bottom:6px}

.foot{text-align:center;color:var(--mute);font-size:.75rem;margin-top:56px}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <span class="eyebrow">SOMETHING</span>
    <h1>雜物收納櫃</h1>
    <p class="sub">生活裡各種主題的筆記與計畫，一個主題一個抽屜。</p>
    <div class="rule"></div>
  </header>

  <h2 class="section-title">抽屜</h2>
  <div class="drawers">
    <a class="drawer trip" href="trip/">
      <div class="icon">✈️</div>
      <h2>旅遊</h2>
      <div class="desc">行程規劃、住宿、交通與美食地圖</div>
      <div class="meta"><span><span class="count">1</span> 趟行程・最新：關西 2026/12</span><span class="arrow">→</span></div>
    </a>
    <div class="drawer empty">
      <div class="plus">＋</div>
      <div>更多抽屜陸續加入</div>
    </div>
  </div>

  <p class="foot">雜物收納櫃 · qp19575091.github.io/something</p>
</main>
</body>
</html>
